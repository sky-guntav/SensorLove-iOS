<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SensorLove Home</title>
<style>
  @font-face { font-family:"Departure Mono"; src:url("fonts/DepartureMono-Regular.woff2") format("woff2"); }
  /* body = clean hardware, screens = playful dither drawn flush on the body.
     Warm bone ink on warm black: nothing is pure white, it should feel like an old device. */
  /* unlit cells: small and faint, the lit dots carry the picture */
  :root { --dots:radial-gradient(circle at 2px 2px, var(--grain) .95px, transparent 1.2px) 0 0 / 4px 4px; }
  /* text tones: --fg live values, the wheel's front label, running names · --mid labels people read · --faint quiet text that must stay legible · --dim decoration and disabled only, never essential text. Accent = data is going out. */
  /* --page, the web round the phone, stays dark in both themes: a theme change happens on the phone only */
  :root { --page:#131210; --bg:#0a0908; --tile:#0f0e0c; --line:#23211d; --grain:#1a1916; --fg:#d6cebd; --mid:#9a9384; --dim:#514c44; --accent:#e0533a; --faint:#807868; --lit:#e2dacb; --hair:#191815; }   /* --fg / --lit a step off white (they read too white): bone, never paper */
  :root[data-theme="light"] { --bg:#c6c0b0; --tile:#c1bbab; --line:#b0a998; --grain:#b9b2a1; --fg:#2b2722; --mid:#524c42; --dim:#8a8477; --faint:#5c564a; --lit:#14120f; --hair:#b9b2a2; }   /* a paper ground (#cec8b8), a step darker; cards a hair darker still; the grid and the dim dots a step darker with it, the ink dots as they were; dim no warmer than the ground (a warmer dim reads yellow; #a09a8d read as barely there, now a step darker) */   /* --lit: the tile toys' ink, a step past --fg. --hair: a closed card's frame, as thick as a running one's but half as loud */
  * { box-sizing:border-box; margin:0; }
  /* Departure Mono is drawn on an 11px grid: keep sizes at 11 / 22 */
  html, body { background:var(--page); color:var(--fg); font:11px/16px "Departure Mono", monospace; -webkit-font-smoothing:none; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0; }
  button:disabled { cursor:default; opacity:.35; }
  :root[data-theme="light"] button:disabled { opacity:.55; }   /* on the light ground .35 left the words (CARD / VALUES, STOP ALL) barely there */
  [hidden] { display:none !important; }
  .stage { min-height:100vh; display:flex; justify-content:center; align-items:center; padding:24px 0; }
  .phone { width:390px; height:844px; background:var(--bg); position:relative; overflow:hidden; display:flex; flex-direction:column; border-radius:44px; box-shadow:0 0 0 10px #050505, 0 30px 80px #0008; }
  @media (max-width:430px) { .stage { padding:0; } .phone { width:100vw; height:100dvh; border-radius:0; box-shadow:none; } }

  .sys { height:47px; flex:none; display:flex; justify-content:space-between; align-items:flex-end; padding:0 30px 4px; }
  /* one row on top: the logo (the frog), the chain says what is flowing, the key pauses it. The frog and the key's icon on the
     cards' 16 px margins, the chain on the middle */
  header.top { flex:none; display:grid; grid-template-columns:44px minmax(0,1fr) 44px; align-items:center; gap:8px; padding:0 16px; height:52px; }
  header.top > .key { justify-self:end; justify-content:flex-end; }
  .logo { width:44px; height:32px; display:flex; }
  .logo canvas { display:block; }   /* sizeMark sizes it */
  .logo:focus-visible { outline:1px solid var(--mid); outline-offset:0; }

  /* channels: a stepped wheel on top of the monitor, neighbours lean away and dither out */
  .wheel { position:relative; height:56px; border-bottom:1px solid var(--line); touch-action:pan-y; cursor:pointer; }
  .wheel canvas { display:block; width:100%; height:56px; }
  .wheel:focus-within canvas { outline:1px solid var(--mid); outline-offset:-1px; }

  /* icon keys: no frame, just a small dithered pixel icon on a 32 px target */
  .key { width:32px; height:32px; display:flex; align-items:center; justify-content:center; flex:none; }
  .key canvas { display:block; }
  .key:focus-visible { outline:1px dotted var(--mid); outline-offset:-2px; }
  .led { width:7px; height:7px; background:var(--dim); flex:none; }
  .led.live { background:var(--accent); animation:blink 1.2s steps(1) infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  .top .txt { justify-self:center; max-width:100%; min-height:32px; display:flex; align-items:center; gap:16px; overflow:hidden; white-space:pre; color:var(--faint); letter-spacing:1px; }
  .top .txt button { min-height:32px; letter-spacing:inherit; }
  .top .txt button:focus-visible { outline:1px dotted var(--mid); outline-offset:-2px; }
  .top .txt b { color:var(--mid); font-weight:400; }
  .top .txt b.z, .top .txt button:hover b, .top .txt button:focus-visible b { color:var(--fg); }
  .top .txt .rec { color:var(--accent); }
  /* the chain's middle: three dots drawn like the glyph's (2 x 2 px, 8 px apart), running right 2 px a step at 12 fps: data on its way, still grey */
  .top .txt .flow i { display:inline-block; width:24px; height:2px; vertical-align:3px; background:linear-gradient(90deg, currentColor 2px, transparent 2px) 3px 0 / 8px 2px repeat-x; animation:flow .33s steps(4) infinite; }
  .top .txt.live .flow i { color:var(--accent); }   /* red: data is going out (gray when bypassed or nobody listens) */
  @keyframes flow { to { background-position:11px 0; } }
  /* text buttons: no frame, four 5 px corner brackets. Hover = brighter brackets, chosen / pressed = filled */
  .btn, .recbtn, .savebtn, .pad .done, .allbtn, .seg button { --bc:var(--mid); display:inline-flex; align-items:center; justify-content:center; min-height:32px; padding:0 12px; letter-spacing:1px; flex:none;
    background:linear-gradient(var(--bc),var(--bc)) 0 0/5px 1px, linear-gradient(var(--bc),var(--bc)) 0 0/1px 5px,
      linear-gradient(var(--bc),var(--bc)) 100% 0/5px 1px, linear-gradient(var(--bc),var(--bc)) 100% 0/1px 5px,
      linear-gradient(var(--bc),var(--bc)) 0 100%/5px 1px, linear-gradient(var(--bc),var(--bc)) 0 100%/1px 5px,
      linear-gradient(var(--bc),var(--bc)) 100% 100%/5px 1px, linear-gradient(var(--bc),var(--bc)) 100% 100%/1px 5px;
    background-repeat:no-repeat; }
  .btn:hover:not(:disabled), .recbtn:hover, .savebtn:hover:not(:disabled), .pad .done:hover, .allbtn:hover, .seg button:hover, .btn:focus-visible, .recbtn:focus-visible, .savebtn:focus-visible, .pad .done:focus-visible, .allbtn:focus-visible, .seg button:focus-visible { --bc:var(--fg); outline:none; }
  .btn.on, .seg button.on { background:var(--fg); color:var(--bg); }

  /* switch = an LED: unlit when off, accent when sending. Big invisible hit area. */
  .sw { position:relative; width:9px; height:9px; background:var(--dim); flex:none; }
  .sw::after { content:""; position:absolute; inset:-17px; }
  .sw[aria-checked="true"] { background:var(--accent); }
  .byp .sw[aria-checked="true"], .deck.byp .sw[aria-checked="true"] { background:transparent; box-shadow:inset 0 0 0 1px var(--accent); }
  .sw:focus-visible { outline:1px solid var(--fg); outline-offset:3px; }
  .ib { color:var(--mid); }
  .ib:hover:not(:disabled), .ib:focus-visible { color:var(--fg); outline:none; }
  /* text keys: a word where an icon would not read (FULL ↗ opens a full screen, ↙ BACK closes it; CARD / VALUES, STOP ALL under the monitor).
     Quiet like the screen's SCOPE / VALUES corner keys: brighter on hover, bright when on */
  .tk { position:relative; display:inline-flex; align-items:center; min-height:28px; padding:0 4px; color:var(--faint); letter-spacing:1px; word-spacing:-4px; white-space:nowrap; flex:none; }   /* half a space between the words: a whole monospace cell split STOP ALL in two */
  .tk::after { content:""; position:absolute; inset:-2px -4px; }
  .tk:hover:not(:disabled) { color:var(--mid); }
  .tk:focus-visible { color:var(--mid); outline:1px dotted var(--mid); outline-offset:0; }
  .tk[aria-pressed="true"] { color:var(--fg); }

  /* monitor rows: label · bar · number. Shared by the stage and the tiles. */
  .rows { display:flex; flex-direction:column; gap:3px; min-width:0; }
  .row { display:grid; grid-template-columns:56px minmax(0,1fr) 64px; align-items:center; gap:8px; height:13px; line-height:13px; flex:none; }
  .row.nobar { grid-template-columns:56px minmax(0,1fr); }
  .row.long { grid-template-columns:116px minmax(0,1fr) 40px; }
  .row .k { color:var(--mid); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .n { text-align:right; white-space:nowrap; color:var(--mid); }   /* values in grey: the bars and the toys carry the light */
  /* gauges are dithered: a dotted track, a 50 % checker fill and a solid 2 px needle at the value */
  .bar { position:relative; height:5px; background:linear-gradient(90deg,var(--line) 0 1px,transparent 1px) 0 0/2px 100%; }
  .bar i { position:absolute; top:0; bottom:0; background:conic-gradient(var(--fg) 25%,transparent 0 50%,var(--fg) 0 75%,transparent 0) 0 0/2px 2px; }
  .bar i::after { content:""; position:absolute; top:0; bottom:0; right:-1px; width:2px; background:var(--fg); }
  .bar i.neg::after { right:auto; left:-1px; }
  .bar.sg::before { content:""; position:absolute; left:50%; top:-2px; bottom:-2px; width:1px; background:var(--mid); }
  .row .bar[hidden] + .n { grid-column:2 / -1; }   /* a value that is a word (a gesture) takes the bar's room too */

  /* ---- stage: a pager. One page per active sensor, then the console. ---- */
  .deck { flex:none; border-bottom:1px solid var(--line); }
  .pager { overflow:hidden; touch-action:pan-y; outline:none; }
  /* pages do not slide: they sit on top of each other and cross-dissolve through a Bayer mask in 4 ticks */
  .track { position:relative; height:280px; }   /* hd 42 + 8 + screen 160 + 8 + 61 (four rows, exactly) = 279, 1 spare: the same on every channel, so the line under the monitor never moves */
  .page { position:absolute; inset:0; min-width:0; padding:0 16px; display:none; flex-direction:column; }
  .page.cur, .page.out { display:flex; }
  .page.out { pointer-events:none; }
  .page .hd { display:flex; align-items:center; gap:10px; height:42px; flex:none; padding-top:12px; }   /* centred, not on a baseline: the LED and the ? box sit on the middle of the name's capitals */
  .page .hd .nm { font-size:22px; letter-spacing:2px; line-height:24px; white-space:nowrap; }   /* 22 = titles only; everything else is 11 */
  .page .hd .osc { color:var(--mid); flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .page .hd .ib { width:28px; height:28px; margin:0 -6px 0 0; align-self:center; }
  /* ? = a small bracketed key right after the name */
  .page .hd .ib.q, .cpage .hd .ib.q { --bc:var(--mid); position:relative; width:22px; height:22px; margin:0; color:var(--fg); letter-spacing:0;
    background:linear-gradient(var(--bc),var(--bc)) 0 0/3px 1px, linear-gradient(var(--bc),var(--bc)) 0 0/1px 3px,
      linear-gradient(var(--bc),var(--bc)) 100% 0/3px 1px, linear-gradient(var(--bc),var(--bc)) 100% 0/1px 3px,
      linear-gradient(var(--bc),var(--bc)) 0 100%/3px 1px, linear-gradient(var(--bc),var(--bc)) 0 100%/1px 3px,
      linear-gradient(var(--bc),var(--bc)) 100% 100%/3px 1px, linear-gradient(var(--bc),var(--bc)) 100% 100%/1px 3px;
    background-repeat:no-repeat; }
  .page .hd .ib.q::after, .cpage .hd .ib.q::after { content:""; position:absolute; inset:-5px; }
  .page .hd .ib.q:hover, .page .hd .ib.q:focus-visible, .cpage .hd .ib.q:hover { --bc:var(--fg); }
  .page .hd .ib.q[aria-expanded="true"], .cpage .hd .ib.q[aria-expanded="true"] { background:var(--fg); color:var(--bg); }
  .scr { position:relative; margin-top:8px; height:160px; flex:none; display:flex; justify-content:center; }
  /* unlit cells stay faintly visible, so the screen reads as a dot-matrix monitor */
  /* unlit cells stay faintly visible: the same round dot as a lit one, in --line */
  .scr canvas { display:block; background:var(--dots); }
  .scr .msg { position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); text-align:center; color:var(--mid); z-index:1; line-height:16px; pointer-events:none; }
  .scr .msg span { display:table; margin:0 auto; padding:0 8px; background:var(--bg); }   /* text sits on a clean patch, not on the static */
  .scr .msg { z-index:2; }
  .scr .rows.all { position:absolute; inset:0; z-index:2; display:none; overflow-y:auto; background:var(--bg); scrollbar-width:none; }
  .page.all .scr .rows.all { display:flex; }
  .page.all .scr { height:229px; }   /* the list takes the rows' place too: one list, nothing repeated under it */
  .page.all .mon { display:none; }
  .page .hd .allbtn { margin-left:auto; align-self:center; min-height:28px; }   /* ALL n / OPEN PAD sit in the title row: the screen's corner belongs to the OSC address */
  .scr .attr { position:absolute; right:0; top:0; z-index:2; padding:0 4px; background:var(--bg); color:var(--faint); }   /* the map's licence asks for credit */
  .scr .attr.tag { right:auto; left:0; color:var(--mid); letter-spacing:1px; }   /* LOCATION: the view and how sure the fix is */
  .scr .attr:empty { display:none; }
  .page.scope .scr .attr, .page.nd .scr .attr, .page.own:not(.vals) .scr .hint { display:none; }
  .page.ndi .scr .hint.camkey { display:block; }   /* VIDEO, DEPTH: NDI ↗ opens their settings, data or not */
  .page.ndi .scr .attr.tag.air { color:var(--accent); }   /* a receiver has the source on program */
  /* a camera sensor (HAND, FACE): the top corners name what it sees; VALUES (bottom left) opens every value full screen,
     CAMERA ↗ (bottom right, where the OSC address sits on other sensors) opens the camera */
  .page.vals .scr .attr { color:var(--mid); letter-spacing:1px; }
  .page.vals .scr .hint { z-index:3; }
  .page.vals .scr .osc, .page.ndi .scr .osc { display:none; }   /* CAMERA ↗, NDI ↗ in its place */
  .scr .hint.camkey { left:auto; right:0; word-spacing:-4px; }
  .scr .hint.camkey::after { inset:-8px 0 0 -8px; }
  .page.tall .scr { height:229px; }  .page.tall .mon { display:none; }   /* HAND, FACE: the monitor runs down to the codes, all picture (FACE's values are a page of their own) */
  /* HAND's values fit its monitor: two columns (H1 | H2, HAND DIST under H2), the moving ones lit, clear of the VALUES and CAMERA ↗ keys */
  .page.fit.all .scr .rows.all { display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(var(--vr), 13px); grid-auto-flow:column; gap:1px 12px; align-content:start; padding-top:2px; overflow:hidden; }
  .page.fit .rows.all .row { grid-template-columns:92px minmax(0,1fr) 40px; gap:6px; }
  .page.fit .rows.all .row.hot .k, .page.fit .rows.all .row.hot .n { color:var(--fg); }
  /* how-to: the wizard tells it from the bottom right; his line types on a clean patch at the bottom left, the OSC address under it */
  .tut { position:absolute; left:0; bottom:0; z-index:5; max-width:calc(100% - 124px); padding:2px 4px; background:var(--bg); color:var(--fg); line-height:16px; pointer-events:none; }
  .tut .to { display:block; color:var(--mid); }
  .tut .cur { display:inline-block; width:6px; height:6px; margin-left:4px; background:var(--fg); }
  .tut.typed .cur { animation:blink .7s steps(1) infinite; }
  .twiz { position:absolute; display:block; pointer-events:none; z-index:5; }
  .page.tpad .scr { cursor:crosshair; } .page.tpad .scr canvas { touch-action:none; }   /* TOUCH: the monitor is a pad */
  .page.sen .scr .osc { position:absolute; right:0; bottom:0; z-index:2; padding:0 4px; background:var(--bg); color:var(--faint); white-space:nowrap; }
  .mon { margin-top:8px; height:61px; flex:none; }
  .page.sen .mon > .rows { height:61px; justify-content:center; }   /* 1-4 rows sit in the middle of the fixed band (4 rows fill it); the offsets stay on whole pixels */
  .page.s-location .mon > .rows, .page.s-weather .mon > .rows { gap:0; justify-content:flex-start; }  .page.s-location .mon .row, .page.s-weather .mon .row { height:12px; line-height:12px; }   /* LOCATION's and WEATHER's five (the address last) fill the same band */
  .row.adr .n { overflow:hidden; text-overflow:ellipsis; }
  /* SCOPE: tap the screen, every axis becomes a trace; the rows give way to TUNE */
  .page:not(.con) .scr { cursor:pointer; }
  .scr .lanes { position:absolute; inset:0; z-index:1; display:none; flex-direction:column; pointer-events:none; }
  .page.scope .scr .lanes { display:flex; }
  .lane { flex:none; display:flex; justify-content:space-between; align-items:flex-start; }
  .lane span { background:var(--bg); padding:0 4px; line-height:12px; white-space:nowrap; }
  .lane .k { color:var(--mid); }
  .scr .hint { position:absolute; left:0; bottom:0; z-index:2; padding:0 4px; background:var(--bg); color:var(--faint); letter-spacing:1px; }   /* keeps its clean patch: traces and VIZ pixels cross the bottom-left cells */
  .scr .hint::after { content:""; position:absolute; inset:-8px -8px 0 0; }
  .scr .hint:hover, .scr .hint:focus-visible { color:var(--mid); outline:none; }
  .scr .hint[aria-pressed="true"] { color:var(--fg); }
  .page.nd .hint:not(.camkey) { display:none; }   /* NO DATA · TAP TO START already says what a tap does (the camera still opens) */
  .tune { display:none; gap:28px; padding-top:2px; }
  .page.scope .mon .tune { display:flex; }
  .tcol { display:flex; flex-direction:column; align-items:flex-start; gap:6px; }
  .tcol .k { color:var(--faint); letter-spacing:1px; }   /* captions, not buttons */
  .page.nd .lanes { display:none; }
  .page.sen .hd .osc { text-align:right; }
  .page.scope .mon .rows, .page.scope .hd .allbtn.more { display:none; }
  .tune .btn, .tune .seg button { min-height:28px; }
  .scr .jarkey { position:absolute; top:40px; width:68px; height:96px; z-index:2; }   /* HELLO's tip jar: rows 10-33, columns 0-16, over the pot and the big tree (the scene sits 4 dots down), the left in script */
  .scr .jarkey:focus-visible { outline:1px dotted var(--mid); outline-offset:-2px; }
  /* HELLO: the line under the floor, GROW OUR LOVE TREE (it opens the jar); now and then the tips go by instead. Left and width in script, on the canvas */
  .scr .htick { position:absolute; bottom:6px; height:16px; overflow:hidden; white-space:nowrap; text-align:left; color:var(--mid); letter-spacing:1px; line-height:16px; z-index:2; }
  .scr .htick span { display:inline-block; padding-left:12px; }
  .scr .htick.run span { padding-left:100%; animation:htick var(--dur) linear 1 forwards; }
  @keyframes htick { to { transform:translateX(-100%); } }
  .mon .jartips { display:none; }  .page.jaron .mon .rows { display:none; }   /* the tip jar open: the band under the monitor holds its prices, side by side */
  .page.jaron .mon .jartips { display:grid; grid-template-columns:repeat(4, auto); justify-content:center; align-content:start; gap:10px; height:100%; padding-top:12px; box-sizing:border-box; }
  .deck.jarrow .chctl { margin-top:-8px; padding-bottom:8px; }   /* the jar: monitor, prices, links and the line under them, 20 px apart each */
  .jartips .btn { min-height:26px; padding:0 10px; }
  .info.big { font-size:14px; line-height:20px; }   /* the tip jar's words, larger */
  .info .iplant { position:absolute; display:block; pointer-events:none; background:none; }   /* the tip jar over HELLO: the love tree in the middle of the words' ground, placed in script */
  .scr .hsay { position:absolute; display:flex; align-items:center; justify-content:center; text-align:center; white-space:pre; color:var(--mid); letter-spacing:1px; line-height:16px; pointer-events:none; }   /* HELLO: the words inside the wizard's speech bubble (placed in script); the screen's dots show through */
  .info .iwiz { position:absolute; display:block; pointer-events:none; }   /* the wizard who tells the info, bottom right, placed on the info's own dot grid in script */
  .allbtn { margin-top:8px; color:var(--mid); }
  .allbtn:hover, .allbtn:focus-visible { color:var(--fg); }
  .hd .openbtn { color:var(--fg); --bc:var(--fg); }

  /* console: same anatomy as a sensor page. OSC OUT is typed on the screen, REC lives underneath. */
  .scr .out { position:absolute; inset:0; z-index:1; overflow-y:auto; scrollbar-width:none; padding:8px 4px; }
  .out .ln { display:grid; grid-template-columns:132px minmax(0,1fr); gap:10px; height:16px; }
  .out .ln .a { color:var(--mid); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .out .ln .a::before { content:""; display:inline-block; width:2px; height:2px; margin:0 6px 2px 0; }  .out .ln.tx .a::before { background:var(--accent); }   /* a red dot: this one is going out now */
  .out .ln .v { color:var(--mid); text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cbot { margin-top:8px; height:61px; flex:none; display:flex; flex-direction:column; justify-content:space-between; }
  .cbot .log, .psub { color:var(--mid); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .recrow { display:flex; align-items:center; gap:12px; }
  .recrow .t { flex:1; color:var(--mid); white-space:nowrap; }
  .recbtn.on { --bc:var(--accent); color:var(--accent); animation:blink 1s steps(1) infinite; }

  /* SEND RATE / DESTINATIONS / SETTINGS live inside the monitor too */
  .scr.panel { display:block; padding:12px 4px; background:var(--dots); }
  .big { font-size:44px; line-height:1; letter-spacing:2px; }
  .big small { font-size:22px; color:var(--mid); margin-left:8px; letter-spacing:2px; }
  .big .sub { display:block; margin-top:10px; font-size:11px; line-height:13px; color:var(--mid); letter-spacing:1px; }   /* SEND RATE: the camera's own rate under the big one */
  .rows.kv .ctlrow { display:flex; align-items:center; justify-content:space-between; }   /* CAMERA's keys in the readout band, like RATE's below */
  .rows.kv .seg button { min-height:24px; padding:0 8px; }   /* the same keys as RATE's (.chctl) */
  .psub { margin-top:10px; }
  .prow { display:flex; align-items:center; gap:12px; min-height:34px; }
  .prow .lab { width:96px; flex:none; color:var(--mid); }
  .prow .v { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .prow .k { color:var(--mid); flex:none; }
  .cbot.opts { justify-content:center; gap:10px; }

  /* under the monitor: the running sensors' three-letter codes on a strip that slides like the channel wheel. The one on the
     monitor sits in the middle; its neighbours fade and dither out toward the edges, so a long row never spills out. */
  .dots { position:relative; display:flex; align-items:center; justify-content:center; height:32px; padding:0 16px; }
  .dots .lkey, .dots .rkey { position:absolute; }   /* CARD / VALUES (what every running card shows: its toy or its numbers; it reads the mode it is in) at the left end of the codes, STOP ALL at the right; the words sit on the 16 px gutter */
  .dots .lkey { left:12px; } .dots .rkey { right:12px; }
  .deck.other .dots > .tk, .deck.min .dots > .tk { display:none; }
  #codes { display:block; width:calc(100% - 200px); height:32px; touch-action:pan-y; cursor:pointer; }   /* centred, clear of the words at both ends by the same */
  .dots:has(#dots :focus-visible) #codes { outline:1px solid var(--mid); outline-offset:-1px; }   /* keyboard on the codes only, not a tap on the keys beside them */
  /* every channel has the same skeleton: readouts in the band under the monitor, its keys in this last row (SENSORS: the codes) */
  .dots .chctl { position:absolute; inset:0 16px 8px; display:none; align-items:center; }   /* 8 px clear of the line below */
  .deck.ctl .dots .chctl { display:flex; }
  .chctl > * { flex:1; min-width:0; }
  .ctlrow { display:flex; align-items:center; justify-content:space-between; gap:12px; }   /* the label left, the keys flush right */
  .ctlrow .k { color:var(--faint); letter-spacing:1px; }
  .chctl .seg button, .chctl .recbtn, .chctl .savebtn, .chctl .btn { min-height:24px; padding:0 8px; }
  .ctlrow .gk { display:flex; align-items:center; gap:8px; }  .ctlrow.mid { justify-content:center; }   /* keysRow's keys: the guide's SKIP and NEXT, the jar's */
  .deck.ctl .dots > .tk, .deck.ctl #codes { visibility:hidden; }   /* the jar's row takes SENSORS' row too */
  .rows.kv { height:61px; justify-content:center; }
  .rows.kv .row { grid-template-columns:auto minmax(0,1fr); }
  .rows.kv .n { overflow:hidden; text-overflow:ellipsis; }
  .page.con .cbot { justify-content:center; }   /* the console's band: its last three log lines; REC is in the last row */
  .page.con .cbot .log { white-space:pre; line-height:16px; }
  .deck.other #codes, .deck.other #dots { visibility:hidden; }   /* the codes belong to SENSORS; elsewhere the row stays, empty, so the cards below never jump */
  .deck { position:relative; }
  .deck > .fold { position:absolute; top:68px; right:5px; width:auto; min-width:32px; gap:8px; }   /* top right of the monitor, on its title row; right 5: the 10 px arrow's edge sits on the 16 px gutter */
  .page.sen .hd { padding-right:28px; }   /* ALL n / OPEN PAD stay clear of the fold arrow */
  .fold .ftx { display:none; color:var(--mid); letter-spacing:1px; }
  .deck.min #codes { display:none; }
  .deck.min > .fold { inset:auto 0 0; height:32px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; column-gap:8px; }   /* the word sits exactly in the middle, the arrow hangs to its right; the whole row unfolds */
  .deck.min .fold::before { content:""; }
  .deck.min .fold .ftx { display:inline; }
  .deck.min .fold canvas { justify-self:start; }
  .deck.min .fold:hover .ftx, .deck.min .fold:focus-visible .ftx { color:var(--fg); }
  .deck.min .pager { display:none; }
  /* one monitor, one size: every channel has the 160 px screen and the meter row underneath (the meters jump to a sensor). Only SENSORS folds. */
  .deck.other .fold { display:none; }
  .page.dest .scr { overflow:hidden; }
  .page.dest .dlist, .page.dest .dedit { max-height:100%; overflow-y:auto; scrollbar-width:none; }   /* the list scrolls, the corner keys stay */
  /* TYPE: three words in the screen's bottom-right corner on a clean patch, like SCOPE; the one in use is bright */
  .prow input { flex:1; min-width:0; padding:0; border:0; border-bottom:1px solid var(--mid); background:none; color:var(--fg); font:inherit; letter-spacing:1px; outline:none; }
  .prow input:focus { border-color:var(--fg); }
  .prow input.bad { border-color:var(--accent); }
  .pname input { text-transform:uppercase; }   /* a preset's name is kept in capitals */
  /* DESTINATIONS: the monitor types every device out like code; tap one to change it, hold it to remove it */
  .dlist { display:flex; flex-direction:column; gap:4px; }
  .dlist .dl { display:block; flex:none; width:100%; text-align:left; color:var(--fg); white-space:pre; overflow:hidden; text-overflow:ellipsis; line-height:16px; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }   /* flex:none: a line keeps its height when the list scrolls (it shrank to a sliver) */
  .dlist .dl span { display:block; overflow:hidden; text-overflow:ellipsis; }
  .dlist .dl.off { color:var(--faint); }
  .dlist .dl.fh { margin-top:12px; color:var(--faint); letter-spacing:1px; }   /* FOUND ON THIS NETWORK: a heading that only reads */
  .dlist .dl.fd { display:flex; align-items:center; gap:8px; color:var(--mid); }  .dlist .dl.fd span { flex:1; min-width:0; }  .dlist .dl.fd .got { flex:none; color:var(--faint); }
  .dlist .dl.fd .btn { min-height:24px; padding:0 8px; }  .dlist .dl.fh:hover, .dlist .dl.fd:hover { background:none; }
  .dlist .dl:hover, .dlist .dl:focus-visible { background:var(--line); outline:none; }
  .dlist .cur { display:inline-block; width:6px; height:6px; margin-left:2px; background:var(--fg); vertical-align:baseline; }
  .dlist:not(.typing) .cur { animation:blink .7s steps(1) infinite; }
  .dedit .prow { min-height:22px; gap:8px; }
  .dedit .prow .lab { width:72px; }
  .dedit .seg button { min-height:20px; padding:0 8px; }
  .dask { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
  .page.set .scr { overflow:hidden; }  .page.set .slist { max-height:100%; overflow-y:auto; overflow-x:hidden; scrollbar-width:none; }   /* SETTINGS: its pages scroll inside the monitor, only up and down */
  .page.set .scr { height:229px; }  .page.set .cbot { display:none; }   /* SETTINGS: one monitor down to the codes, everything on it (readouts under it said it twice) */
  .page.set .scr { display:flex; flex-direction:column; }  .page.set .slist { flex:1; min-height:0; max-height:none; }   /* the tabs stay, the page under them scrolls */
  .slist .srow { display:flex; align-items:center; gap:8px; flex:none; min-height:44px; width:100%; padding:0 8px; text-align:left; }   /* a name, its value flush right; a tap opens what is under it */
  .slist .srow:hover { background:var(--line); }  .slist .srow:focus-visible { outline:1px dotted var(--mid); outline-offset:-1px; }
  .slist .sk { font-size:17px; letter-spacing:1px; line-height:24px; color:var(--fg); white-space:nowrap; }   /* between 11 and the titles' 22 */
  .slist .sv { flex:1; text-align:right; color:var(--mid); white-space:nowrap; }
  .slist.open .srow:not(.shown) .sk { color:var(--faint); }   /* one open: the others go quiet */
  .slist .srow.shown { background:var(--line); }   /* the open one sits on a soft block, no outline */
  .slist .sin, .slist .dl.sin { padding-left:20px; }  .slist .ctlrow.sin { min-height:40px; }   /* what opened sits in under its name */
  .slist .stext { color:var(--mid); line-height:16px; white-space:normal; letter-spacing:1px; padding-bottom:8px; }
  .slist .dl { padding:10px 0; }                        /* a page's keys (a permission, contact) */
  .slist .dl.sl { padding:0; color:var(--mid); }  .slist .dl.sl:hover { background:none; }
  .slist .dl.sh { margin-top:8px; color:var(--fg); letter-spacing:1px; }   /* OSC ADDRESSES: a sensor's name over its addresses */   /* a line that only reads (the addresses, about) */
  .slist .dl.pre { color:var(--mid); }  .slist .dl.pre.use { color:var(--fg); }   /* PRESETS: the one in use in full ink */
  .slist .psel { --bc:var(--mid); flex:none; background:linear-gradient(var(--bc),var(--bc)) 0 0/5px 1px, linear-gradient(var(--bc),var(--bc)) 0 0/1px 5px,
      linear-gradient(var(--bc),var(--bc)) 100% 0/5px 1px, linear-gradient(var(--bc),var(--bc)) 100% 0/1px 5px,
      linear-gradient(var(--bc),var(--bc)) 0 100%/5px 1px, linear-gradient(var(--bc),var(--bc)) 0 100%/1px 5px,
      linear-gradient(var(--bc),var(--bc)) 100% 100%/5px 1px, linear-gradient(var(--bc),var(--bc)) 100% 100%/1px 5px; background-repeat:no-repeat; }   /* PRESETS: the selected one and its keys in focus corners, like the camera's on a face */
  .slist .psel .dl.pre { color:var(--fg); }  .slist .pkeys { display:flex; gap:8px; padding-bottom:10px; }  .slist .psel .btn { min-height:24px; padding:0 8px; }
  .slist .pline { display:flex; align-items:center; gap:8px; }  .slist .pline .dl { flex:1; min-width:0; }  .slist .pline .btn { margin-right:8px; }   /* USE beside the selected one */
  .slist .dl .pnm { display:inline; }  .slist button.pnm { padding:10px 0; margin:-10px 0; text-decoration:underline dotted var(--mid); text-underline-offset:3px; }   /* its name in the line (a device's lines are blocks); a tap on it renames it: the line's height, the name's width */
  .slist .pname { display:flex; align-items:center; }  .slist .pname input { flex:none; width:15ch; padding:0; border:0; border-bottom:1px solid var(--fg); background:none; color:var(--fg); font:inherit; text-transform:uppercase; outline:none; }
  .slist .pname input.bad { border-color:var(--accent); }   /* the selected one's name, a field in its own place */
  .slist .dask { height:auto; align-items:flex-start; gap:8px; padding-bottom:12px; }   /* a question in a line's place (DELETE IT?, OPEN iOS SETTINGS?) */
  .slist .psel .dask { padding-bottom:10px; }  .slist .psel .yn { gap:8px; }
  .dask .yn { display:flex; gap:16px; }
  .dedit input::placeholder { color:var(--dim); }
  .cbot .drow { display:flex; align-items:center; gap:8px; }
  .cbot .drow .k { width:40px; color:var(--faint); letter-spacing:1px; }
  .cbot .drow .seg button { min-height:24px; padding:0 8px; }
  .cbot .drow .grow { flex:1; }
  .cbot .drow .grow + .k { text-align:right; }
  .dtile .addr { position:absolute; left:0; right:0; top:2px; display:flex; flex-direction:column; color:var(--faint); line-height:13px; white-space:nowrap; overflow:hidden; pointer-events:none; }
  .dtile.on .addr { color:var(--mid); }
  .dadd .nm { color:var(--mid); }

  main { flex:1; overflow-y:auto; overflow-x:hidden; overscroll-behavior:none; touch-action:pan-y; padding:0 16px; scrollbar-width:none; display:flex; flex-direction:column; }   /* a column, so a short list still has its footer at the bottom; it only ever scrolls up and down (iOS let the cards slide sideways); at both ends iOS's stretch ran too far: off, a small give of its own instead (tiltTick) */
  main > * { flex:none; }
  /* the bottom 56 px of the list dither away, like the wheel's edges (the Bayer strip is drawn in script). Over the last 56 px of
     scroll the fade sinks below the edge (--fade, set in script): at the end there is nothing more below, and the footer sits clear */
  main { --fade:56px; -webkit-mask-repeat:no-repeat, repeat-x; mask-repeat:no-repeat, repeat-x;
    -webkit-mask-position:top, 0 calc(100% + 56px - var(--fade)); mask-position:top, 0 calc(100% + 56px - var(--fade));
    -webkit-mask-size:100% calc(100% - var(--fade)), 8px 56px; mask-size:100% calc(100% - var(--fade)), 8px 56px; }
  main::-webkit-scrollbar, .out::-webkit-scrollbar, .rows.all::-webkit-scrollbar, .dlist::-webkit-scrollbar, .dedit::-webkit-scrollbar { display:none; }
  .seg { display:flex; gap:4px; }
  .seg button { min-height:30px; color:var(--mid); }
  .seg button.on { color:var(--bg); }
  .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
  .grid.all { margin-top:16px; }
  /* the footer ends the list, on a full-width strip of the screens' grain: none at its top edge, thickest at the bottom (drawn in script) */
  .foot { height:72px; margin:auto -16px 0; padding-top:32px; text-align:center; color:var(--faint); letter-spacing:1px; white-space:nowrap; background:left bottom / 8px auto repeat-x; }   /* the top 20 px keep it off the last cards, the strip is the bottom 52; the text clears the home indicator */

  /* tile = module. App's top-right notch, border drawn as outer/inner clip layers */
  .tile { --n:10px; --b:1px; position:relative; background:var(--hair); clip-path:polygon(0 0,calc(100% - var(--n)) 0,100% var(--n),100% 100%,0 100%,0 34px,3px 34px,3px 24px,0 24px); cursor:pointer; user-select:none; -webkit-touch-callout:none; outline:none; }
  .tile::before { content:""; position:absolute; inset:var(--b); background:var(--tile); clip-path:polygon(0 0,calc(100% - var(--n)) 0,100% var(--n),100% 100%,0 100%,0 34px,3px 34px,3px calc(24px - 2 * var(--b)),0 calc(24px - 2 * var(--b))); }   /* inner outline = outer notch grown by the frame's width (--b) */
  .tile.on { background:var(--line); }      /* a running card's frame; a closed card has the same frame in a quieter tone */
  .tile.sel { background:color-mix(in srgb, var(--accent) 60%, var(--tile)); }   /* the one on the monitor right now: the accent, softened toward the card */
  .tile:not(.on):not(.dtile) { --b:2px; background:color-mix(in srgb, var(--tile) 75%, var(--hair)); }
  .grid { position:relative; }
  .tile { transition:translate .22s cubic-bezier(.2, .7, .2, 1), scale .18s ease-out, rotate .2s ease-out; }   /* a card being reordered, and the ones making room */
  .grid.lifting .tile:not(.lift) { scale:.96; }       /* held: the others step back */
  .tile.lift { --b:2px; z-index:3; scale:1.06; cursor:grabbing; transition:scale .12s ease-out, rotate .15s ease-out; background:repeating-conic-gradient(var(--fg) 0 25%, transparent 0 50%) 0 0 / 2px 2px; }   /* it comes forward, on the finger (no lag); a bright dithered frame */
  .lshadow { position:absolute; z-index:2; scale:1.06; pointer-events:none; background:repeating-conic-gradient(var(--dim) 0 25%, transparent 0 50%) 0 0 / 2px 2px; clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%); }   /* its shadow, in dither */
  @media (prefers-reduced-motion: reduce) { .tile, .tile.lift { transition:none; } }   /* held to be moved: a bright dithered frame */   /* a closed sensor card: a thick frame almost the fill's tone; before the focus rule so a keyboard ring still shows */
  .tile > * { position:relative; }
  .tile .hit { position:absolute; inset:0; } .tile .hit:focus { outline:none; } .tile:has(.hit:focus-visible) { --b:2px; background:var(--fg); }
  /* SD card on a 4 px grid: 8 pad · 20 name · 4 · 48 screen · 8 pad = 88 tall, a little wider than tall */
  .tile .in { padding:8px; display:flex; flex-direction:column; gap:4px; }
  /* the name is plain 11 px type: bone when running or selected, --mid when closed (quieter by tone, never heavier) */
  .tile .hd { display:flex; align-items:center; gap:6px; height:20px; }
  .tile .hd .sw { width:7px; height:7px; }
  .tile .hd .sw::after { inset:-14px -8px -10px -6px; }   /* 21 x 31 target: the gap to its left and no further, so a tap on the name never stops the sensor; it ends 0.5 px above the screen */
  .tile .nm { flex:1; min-width:0; overflow:hidden; white-space:nowrap; letter-spacing:1px; color:var(--mid); text-shadow:.34px 0 currentColor; }   /* a step bolder (the font has one weight): the name again a device pixel to the right on a 3x screen */ .tile.on .nm, .tile.sel .nm { color:var(--fg); }
  .tile .tmark { font-style:normal; color:var(--mid); }
  .tile .ts { position:relative; height:48px; }
  .tile canvas { display:block; margin:0 auto; height:48px; } /* 48 = 12 cells × 4 px, the monitor's dot; width set in whole cells */
  .tile .tmsg { position:absolute; left:0; right:0; bottom:2px; text-align:center; color:var(--mid); pointer-events:none; }
  .tile .tmsg span { background:var(--tile); padding:0 4px; }
  .tile .ts .rows { display:none; position:absolute; inset:0; justify-content:center; }
  .tile.mv canvas { display:none; }
  .tile.mv .ts .rows { display:flex; }
  .tile .row { grid-template-columns:auto minmax(0,1fr) auto; gap:4px; height:11px; line-height:11px; }
  .tile .ts .rows { gap:1px; }
  .tile .row.nobar, .tile .row.long { grid-template-columns:minmax(0,1fr) auto; }
  .tile .row.long .bar { display:none; }
  .tile .bar { height:4px; }
  .tile .row .n { color:var(--mid); }   /* tiles stay quiet: only the name is bright */
  .tile.byp::after { content:""; position:absolute; inset:2px; background:repeating-linear-gradient(135deg,var(--fg) 0 1px,transparent 1px 7px); opacity:.16; pointer-events:none; }

  /* full-screen touch pad */
  .pad { position:absolute; top:47px; left:0; right:0; bottom:0; z-index:7; background:var(--bg); display:flex; flex-direction:column; }
  .pad .phd { flex:none; display:flex; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(--line); }
  .pad .phd .nm { letter-spacing:1px; }
  .pad .phd .osc { flex:1; min-width:0; color:var(--mid); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pad .area { flex:1; min-height:0; position:relative; touch-action:none; overflow:hidden; cursor:crosshair; display:flex; justify-content:center; align-items:center; }
  .pad .area canvas { display:block; }
  .pad .lab { position:absolute; transform:translate(-50%,-100%); background:var(--bg); padding:0 3px; pointer-events:none; letter-spacing:1px; }
  .pad .pft { flex:none; min-height:64px; padding:10px 16px 26px; border-top:1px solid var(--line); color:var(--mid); }
  .pad.cam .area { cursor:default; }   /* the hand camera: the monitor opened up (it grows out of the monitor and shrinks back, in script) */
  .pad.cam .pft { display:flex; flex-direction:column; gap:8px; }
  .pad.cam .ctlrow input { width:60%; min-height:28px; padding:0 4px; border:0; border-bottom:1px dotted var(--mid); background:none; color:var(--fg); font:inherit; letter-spacing:1px; text-align:right; text-transform:uppercase; }   /* VIDEO's and DEPTH's NAME: typed in place, as a preset's */
  .pad.cam .ctlrow input:focus { outline:none; border-bottom-color:var(--fg); }
  .pad.cam .ctlrow.links { justify-content:space-between; }
  #dark { position:fixed; inset:0; z-index:50; background:#000; color:#1a1916; display:flex; align-items:flex-end; justify-content:center; padding-bottom:calc(24px + env(safe-area-inset-bottom)); letter-spacing:1px; }   /* DARK: a source runs on, nothing lit; a tap wakes it */
  /* the gesture catalogue under the camera: every gesture the app tells apart, in its OSC order (the number in the corner);
     the ones the hands make light up and say whose */
  .gcat { flex:none; padding:0 16px; border-top:1px solid var(--line); }
  .gcat .ghd { display:flex; align-items:center; gap:8px; width:100%; min-height:32px; color:var(--faint); letter-spacing:1px; }
  .gcat .ghd .osc { margin-left:auto; letter-spacing:0; }
  .gcat .ghd canvas { display:block; flex:none; }
  .gcat .ghd:hover, .gcat .ghd:focus-visible { color:var(--fg); outline:none; }
  .gcat .ghd:focus-visible canvas { outline:1px dotted var(--mid); outline-offset:2px; }
  .glist { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:8px; padding:0 0 10px; }
  .glist > div { min-width:0; }
  .glist .gt { display:flex; flex-direction:column; align-items:center; gap:4px; width:100%; min-width:0; color:var(--mid); }
  .glist .gt:focus-visible { outline:none; } .glist .gt:focus-visible canvas, .glist .gt[aria-pressed="true"] canvas { outline:1px dotted var(--fg); outline-offset:1px; }
  .glist .gs { position:relative; display:block; }
  .glist canvas { display:block; height:72px; background:var(--dots); }
  .glist .n, .glist .who { position:absolute; top:0; padding:0 3px; line-height:11px; background:var(--bg); }
  .glist .n { left:0; color:var(--faint); }
  .glist .who { right:0; color:var(--fg); }
  .glist .who:empty { display:none; }
  .glist b { font-weight:400; letter-spacing:1px; white-space:nowrap; }
  .glist .on b, .glist .gt:hover b { color:var(--fg); }

  /* full-screen console: the console page stretched to the phone, log grows to 12 lines */
  /* FACE's and HAND's values, full screen: every one at once, in its group, two columns (your left / H1 in the left one where they pair) */
  .vlist { flex:1; min-height:0; overflow-y:auto; padding:0 16px 6px; scrollbar-width:none; }
  .vlist::-webkit-scrollbar { display:none; }
  .vlist .vh { display:flex; justify-content:space-between; padding:6px 0 3px; margin-bottom:4px; border-bottom:1px solid var(--line); color:var(--faint); letter-spacing:1px; }   /* tight enough that all 69 fit a 375 x 812 phone */
  .vlist .rows { display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(var(--vr), 13px); grid-auto-flow:column; gap:2px 12px; }
  .vlist .row { grid-template-columns:92px minmax(0,1fr) 40px; gap:6px; }
  .vlist .row.hot .k, .vlist .row.hot .n { color:var(--fg); }   /* moving now: the ones your face is making, the fingers up and the gesture a hand is making */
  .pad.vfull .pft { min-height:0; padding:8px 16px 16px; display:flex; justify-content:flex-end; }
  .pad.lic pre { flex:1; min-height:0; overflow:auto; margin:0; padding:12px 16px 26px; white-space:pre-wrap; overflow-wrap:anywhere; font:inherit; color:var(--mid); }   /* NDI's open-source licences, as they come */
  .cpage { flex:1; min-height:0; display:flex; flex-direction:column; padding:0 16px 26px; }
  .cpage .hd { display:flex; align-items:baseline; gap:10px; height:48px; flex:none; padding-top:14px; }
  .cpage .hd .nm { font-size:22px; letter-spacing:2px; line-height:24px; }
  .cpage .hd .osc { color:var(--mid); flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cpage .hd .ib { width:28px; height:28px; align-self:center; }
  .cpage .hd .tk, .pad .phd .tk { align-self:center; }   /* FULL ↗ opens, ↙ BACK closes what it opened */
  .cpage .scr { flex:1; height:auto; min-height:0; background:var(--dots); }
  .cpage .scr canvas { display:none; }
  .cpage .cbot { height:auto; gap:14px; }
  .cpage .log { white-space:pre; line-height:18px; }

  /* info: typed by the stage screen itself, on its dot matrix */
  .info { position:absolute; inset:0; z-index:3; padding:10px 6px 18px; line-height:18px; cursor:pointer;
    background:var(--dots), var(--bg); }
  .info .cur { display:inline-block; width:6px; height:6px; margin-left:4px; background:var(--fg); }
  .info.typed .cur { animation:blink .7s steps(1) infinite; }

  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(root) { animation:none; }

  .guide { position:absolute; inset:0; z-index:15; cursor:pointer; touch-action:none; }

  .gsay { position:relative; min-height:76px; padding:10px 128px 10px 6px; line-height:18px; background:var(--dots); }   /* the wizard stands bottom right, beside the words */
  .gsay .iwiz { position:absolute; display:block; pointer-events:none; }
  .gbox .ctlrow { padding:4px 6px 6px; }

  .intro { position:absolute; inset:0; z-index:20; background:var(--bg); cursor:pointer; animation:introGone 0s 15s forwards; }
  .intro canvas { display:block; width:100%; height:100%; }

<script>
// ---------- the app: SensorLove for iOS sets window.SL before this script runs. Then the page posts to Swift, and Swift keeps what
// the page keeps (a browser's localStorage) from one launch to the next. Without SL this is the browser study, on fake data ----------
function post(t, d) { if (window.SL) { webkit.messageHandlers.sl.postMessage(Object.assign({ t:t }, d)); } }
var APPSTORE = window.SL && {
  getItem:function (k) { return k in SL.store ? SL.store[k] : null; },
  setItem:function (k, v) { SL.store[k] = String(v); post('store', { k:k, v:String(v) }); },
  removeItem:function (k) { delete SL.store[k]; post('store', { k:k, v:null }); }
};
function store() { return APPSTORE || localStorage; }   // in a browser localStorage is read inside each caller's try: a sandbox may refuse it

// ---------- what the sensors read: TOUCH and LOCATION are the page's own, the rest come from the app. Nothing is made up ----------
var S = { time:0, touches:[], lastTouch:null }, READS = {};   // READS: the app's readings, by sensor id (SL.recv v, 30 times a second)
var phone = document.getElementById('phone');

function clamp(v) { return Math.max(0, Math.min(1, v)); }

// ---------- dither buffer: 0 = unlit, 1 = ink, 2 = dim ink ----------
var BAYER = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function Buf(w, h) { this.w = w; this.h = h; this.a = new Uint8Array(w * h); }
Buf.prototype.clear = function () { this.a.fill(0); };
// b: 0..1 brightness in two inks, the way the map shades: 1 focus = ink; .5 body = dim; .25 shade = dim on every other dot,
// and below that dim thinning out. A dim dot never covers ink.
Buf.prototype.plot = function (x, y, b) {
  x = Math.round(x); y = Math.round(y);
  if (x < 0 || y < 0 || x >= this.w || y >= this.h || b <= 0) { return; }
  var i = y * this.w + x;
  if (b >= .75) { this.a[i] = 1; } else if (!this.a[i] && (b >= .4 || b * 2 > (BAYER[(y & 3) * 4 + (x & 3)] + .5) / 16)) { this.a[i] = 2; }
};
Buf.prototype.ink = function (x, y, b) {               // the one-ink dither: sparse ink dots (the map's water)
  x = Math.round(x); y = Math.round(y);
  if (x >= 0 && y >= 0 && x < this.w && y < this.h && b > (BAYER[(y & 3) * 4 + (x & 3)] + .5) / 16) { this.a[y * this.w + x] = 1; }
};
Buf.prototype.px = function (x, y, on) {
  x = Math.round(x); y = Math.round(y);
  if (x >= 0 && y >= 0 && x < this.w && y < this.h) { this.a[y * this.w + x] = on ? 1 : 0; }
};
Buf.prototype.dim = function (x, y) {   // background detail: never paints over ink
  x = Math.round(x); y = Math.round(y);
  if (x >= 0 && y >= 0 && x < this.w && y < this.h && !this.a[y * this.w + x]) { this.a[y * this.w + x] = 2; }
};
Buf.prototype.put = function (x, y, v) {   // a dot in another ink: 3 red, 4-9 the rainbow (drawDots)
  x = Math.round(x); y = Math.round(y);
  if (x >= 0 && y >= 0 && x < this.w && y < this.h) { this.a[y * this.w + x] = v; }
};
function Tint(g, v) { this.g = g; this.v = v; }       // paper art in a colour: its lit dots in ink v, its shade as it is
Tint.prototype.px = function (x, y, on) { if (on) { this.g.put(x, y, this.v); } };
Tint.prototype.dim = function (x, y) { this.g.dim(x, y); };
var JOY_INKS = [[228, 3, 3], [255, 140, 0], [255, 237, 0], [0, 128, 38], [36, 64, 142], [115, 41, 130]];   // the rainbow flag's six: a tip's flowers, the one time HELLO has colour
// pixel art: lines run between whole dots, so a slope keeps even steps (a 1:2 goes 1, 2, 2, 2…) and never doubles a corner.
// Ties step away from the start: a line leaving a corner leaves it diagonally, clear of the other lines meeting there.
Buf.prototype.line = function (x1, y1, x2, y2, b) {
  x1 = Math.round(x1); y1 = Math.round(y1); x2 = Math.round(x2); y2 = Math.round(y2);
  var ax = Math.abs(x2 - x1), ay = Math.abs(y2 - y1), sx = x2 < x1 ? -1 : 1, sy = y2 < y1 ? -1 : 1, n = Math.max(ax, ay, 1), j;
  for (j = 0; j <= n; j++) { this.plot(x1 + sx * Math.floor(ax * j / n + .5), y1 + sy * Math.floor(ay * j / n + .5), b); }
};
// a chain of lines, pixel-perfect: where a joint makes an L of three dots its corner goes, so the chain stays one dot thick
Buf.prototype.path = function (P, b) {
  var q = [], j, k;
  for (j = 1; j < P.length; j++) {
    var x1 = Math.round(P[j - 1][0]), y1 = Math.round(P[j - 1][1]), x2 = Math.round(P[j][0]), y2 = Math.round(P[j][1]);
    var ax = Math.abs(x2 - x1), ay = Math.abs(y2 - y1), sx = x2 < x1 ? -1 : 1, sy = y2 < y1 ? -1 : 1, n = Math.max(ax, ay, 1);
    for (k = 0; k <= n; k++) {
      var p = [x1 + sx * Math.floor(ax * k / n + .5), y1 + sy * Math.floor(ay * k / n + .5)], m = q[q.length - 1], l = q[q.length - 2];
      if (m && m[0] === p[0] && m[1] === p[1]) { continue; }
      if (l && Math.abs(l[0] - p[0]) === 1 && Math.abs(l[1] - p[1]) === 1) { q.pop(); }   // m was the L's corner
      q.push(p);
    }
  }
  for (j = 0; j < q.length; j++) { this.plot(q[j][0], q[j][1], b); }
};
// a round disc on a whole dot: symmetric, and r * .5 of slack rounds it off (r*r alone leaves a nub on each side)
Buf.prototype.disc = function (cx, cy, r, b) {
  cx = Math.round(cx); cy = Math.round(cy);
  for (var y = -Math.ceil(r); y <= r; y++) for (var x = -Math.ceil(r); x <= r; x++) {
    if (x * x + y * y <= r * r + r * .5) { b < 0 ? this.px(cx + x, cy + y, false) : this.plot(cx + x, cy + y, b); }
  }
};
// round things on any screen: a card's Coarse lands a toy's 32-row drawing on its own dots (k a unit), so the nub-free slack is
// counted in the dots it lands on, and onDot() puts a centre on a whole dot there (a round thing off its dot comes out lopsided)
function onDot(g, v) { var k = g.k || 1; return Math.round(v * k) / k; }
function inOval(g, dx, dy, rx, ry) { return dx * dx / (rx * rx) + dy * dy / (ry * ry) <= 1 + .5 / (Math.min(rx, ry) * (g.k || 1)); }
Buf.prototype.oval = function (cx, cy, rx, ry, b) {    // an ellipse's outline, one dot thick (the rim shape() would give it)
  var g = this, x, y, inn = function (x, y) { return inOval(g, x - cx, y - cy, rx, ry); };
  for (y = Math.floor(cy - ry - 1); y <= cy + ry + 1; y++) for (x = Math.floor(cx - rx - 1); x <= cx + rx + 1; x++) {
    if (inn(x, y) && (!inn(x - 1, y) || !inn(x + 1, y) || !inn(x, y - 1) || !inn(x, y + 1))) { this.plot(x, y, b); }
  }
};
Buf.prototype.ring = function (cx, cy, r, b) {         // midpoint circle: one dot thick, its steps grow and shrink evenly
  cx = Math.round(cx); cy = Math.round(cy); r = Math.round(r);
  var x = r, y = 0, e = 1 - r, g = this, o = function (a, c) { g.plot(cx + a, cy + c, b); g.plot(cx - a, cy + c, b); g.plot(cx + a, cy - c, b); g.plot(cx - a, cy - c, b); };
  while (x >= y) { o(x, y); o(y, x); y++; if (e < 0) { e += 2 * y + 1; } else { x--; e += 2 * (y - x) + 1; } }
};
Buf.prototype.tri = function (ax, ay, bx, by, cx, cy, b) {
  var x0 = Math.floor(Math.min(ax, bx, cx)), x1 = Math.ceil(Math.max(ax, bx, cx));
  var y0 = Math.floor(Math.min(ay, by, cy)), y1 = Math.ceil(Math.max(ay, by, cy)), x, y, d1, d2, d3;
  for (y = y0; y <= y1; y++) for (x = x0; x <= x1; x++) {
    d1 = (x - bx) * (ay - by) - (ax - bx) * (y - by);
    d2 = (x - cx) * (by - cy) - (bx - cx) * (y - cy);
    d3 = (x - ax) * (cy - ay) - (cx - ax) * (y - ay);
    if (!((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0))) { b < 0 ? this.px(x, y, false) : this.plot(x, y, b); }
  }
};
// a filled shape with an ink outline (bare: none): inside(x, y) says where it is, tone(x, y) shades it. It covers what was there.
Buf.prototype.shape = function (inside, tone, bare) {
  for (var y = 0; y < this.h; y++) for (var x = 0; x < this.w; x++) {
    if (!inside(x, y)) { continue; }
    this.px(x, y, false);
    if (!bare && (!inside(x - 1, y) || !inside(x + 1, y) || !inside(x, y - 1) || !inside(x, y + 1))) { this.px(x, y, true); } else { this.plot(x, y, tone(x, y)); }
  }
};
Buf.prototype.edge = function (M) {                    // ink round the outside of the dots set in M (same size), as shape() rims
  var w = this.w, h = this.h, on = function (x, y) { return x >= 0 && y >= 0 && x < w && y < h && M.a[y * w + x]; };
  for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
    if (on(x, y) && (!on(x - 1, y) || !on(x + 1, y) || !on(x, y - 1) || !on(x, y + 1))) { this.a[y * w + x] = 1; }
  }
};

// touch pad heat fields: fingers warm them, they cool every frame. PAD is the full-screen pad; MPAD the monitor, which is a pad
// itself on the TOUCH page (one cell per monitor dot), and the TOUCH card shows it in miniature
var PAD = { w:130, h:235, heat:new Float32Array(130 * 235) }, MPAD = { w:89, h:40, heat:new Float32Array(89 * 40), last:0 };
function stamp(F, cx, cy, r) {                         // warm a field round a finger: hottest under it, cool at r
  var x, y, x0 = Math.max(0, Math.floor(cx - r)), x1 = Math.min(F.w - 1, Math.ceil(cx + r)), y0 = Math.max(0, Math.floor(cy - r)), y1 = Math.min(F.h - 1, Math.ceil(cy + r));
  for (y = y0; y <= y1; y++) for (x = x0; x <= x1; x++) {
    var v = 1 - Math.sqrt((x - cx) * (x - cx) + (y - cy) * (y - cy)) / r, k = y * F.w + x;
    if (v > F.heat[k]) { F.heat[k] = v; }
  }
}
function mpadTick(k) {                                 // every step (k ticks): the monitor pad's trails melt, the fingers on it warm it along their path
  var F = MPAD, i, m = Math.pow(.82, k || 1);
  for (i = 0; i < F.heat.length; i++) { F.heat[i] *= m; }
  S.touches.forEach(function (f) {
    var cx = f.x * (F.w - 1), cy = f.y * (F.h - 1), n;
    if (f.mx == null) { f.mx = cx; f.my = cy; }
    n = Math.max(1, Math.ceil(Math.hypot(cx - f.mx, cy - f.my) / 2));
    for (i = 1; i <= n; i++) { stamp(F, f.mx + (cx - f.mx) * i / n, f.my + (cy - f.my) * i / n, 4.5); }
    f.mx = cx; f.my = cy;
  });
  if (S.touches.length) { F.last = S.time; }
}

// ---------- screens: VIZ[id](g, t, v, live, c) ----------
// t = frame number (0 when off = rest pose), v = per-screen state
var VIZ = {};

// GYRO: paper pinwheel. Rotation rate = spin speed, fast spin smears into blur. A twist spins it up at once; let go and it
// coasts, winding down over a few seconds.
VIZ.gyro = function (g, t, v, live, c, d) {
  var cx = g.w >> 1, cy = 13, R = 12, i, a, w = live && d ? clamp(Math.hypot(d[0], d[1], d[2]) / 6) : 0;   // 6 rad/s: a full blur
  v.spin = w > (v.spin || 0) ? (v.spin || 0) + (w - (v.spin || 0)) * .6 : (v.spin || 0) * .93;   // a tenth left after about 3 s
  var rate = v.spin;
  v.rot = (v.rot || 0) + (live ? .06 + rate * .9 : 0);
  if (g.k < 1) {                                       // a card, on its own dots: four blades, lit and shaded in turn, turning in eighths of a turn (finer reads as mush at 9 dots)
    var n = g.b, x0 = n.w >> 1, q = Math.round(v.rot / .7854) * .7854;
    n.line(x0, 5, x0, n.h - 1, .5);
    for (i = 0; i < 4; i++) { a = q + i * 1.5708; n.tri(x0, 5, Math.round(x0 + Math.cos(a) * 4.5), Math.round(5 + Math.sin(a) * 4.5), Math.round(x0 + Math.cos(a + .75) * 3.15), Math.round(5 + Math.sin(a + .75) * 3.15), i % 2 ? .5 : 1); }
    n.px(x0, 5, true);
    return;
  }
  g.line(cx, cy, cx, 31, .5);                       // stick
  if (rate > .3) { g.disc(cx, cy, R, (rate - .3) * .35); } // spin blur
  for (i = 0; i < 4; i++) {                         // blade = paper fold: bright half + shaded half
    a = v.rot + i * Math.PI / 2;
    var tx = cx + Math.cos(a) * R, ty = cy + Math.sin(a) * R;
    var sx = cx + Math.cos(a + 1.2) * R * .6, sy = cy + Math.sin(a + 1.2) * R * .6;
    var mx = cx + Math.cos(a + .55) * R * .5, my = cy + Math.sin(a + .55) * R * .5;
    g.tri(cx, cy, tx, ty, mx, my, 1);
    g.tri(cx, cy, mx, my, sx, sy, .5);
    g.line(cx, cy, tx, ty, 1);
  }
  g.disc(cx, cy, 1.5, -1); g.px(cx, cy, true);       // pin
  if (rate > .6 && t % 2) {                          // little wind ticks when it really spins
    g.plot(cx - R - 4, cy - 3, 1); g.plot(cx - R - 3, cy - 3, 1);
    g.plot(cx + R + 3, cy + 4, 1); g.plot(cx + R + 4, cy + 4, 1);
  }
};

// ---------- MOTION: a shelf of physics toys, drawn like the pinwheel ----------
